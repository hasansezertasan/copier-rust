---
name: Test
# Renders the template and runs the repo's own test suite. Deny-by-default; the
# job opts back into exactly what it needs.
permissions: {}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    name: Template renders and updates cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550  # v5.2.2
        with:
          install: false
          cache: false
      - name: Run the tests
        run: |
          mise trust .config/mise.toml
          mise install
          mise run test
